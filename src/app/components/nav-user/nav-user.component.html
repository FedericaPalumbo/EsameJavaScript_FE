<div class="nav-user">
    <img class="user-avatar" [src]="user().picture" [alt]="user().fullName">
    <!-- nome e ruolo si nascondono sotto sm: su mobile restano solo avatar e pulsante di uscita -->
    <div class="user-text d-none d-sm-block">
        <div class="user-name">{{ user().fullName }}</div>
        <div class="user-role">{{ user().role === 'teacher' ? 'Docente' : 'Studente' }}</div>
    </div>
    <button type="button" class="logout-btn" title="Esci" aria-label="Esci" (click)="logout()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
        </svg>
    </button>
</div>
