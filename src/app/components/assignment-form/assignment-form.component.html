<div class="modal-header">
    <h4 class="modal-title">Nuova attività</h4>
    <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
    <form [formGroup]="assignmentForm" (ngSubmit)="submit()">
        <div>
            <label class="form-label" for="assignment-title">Descrizione dell'attività</label>
            <p class="section-hint">Spiega in poche parole cosa devono fare gli studenti.</p>
            <input id="assignment-title" type="text" class="form-control" placeholder="Es. Completare esercizio"
                formControlName="title"
                [class.is-invalid]="assignmentForm.controls.title.invalid && assignmentForm.controls.title.touched">
            <div class="invalid-feedback">La descrizione è obbligatoria</div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-primary btn-create" (click)="submit()" [disabled]="assignmentForm.invalid">Crea
        attività</button>
</div>
