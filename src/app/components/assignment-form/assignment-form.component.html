<div class="modal-header">
    <h4 class="modal-title">Nuova attività</h4>
    <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
    <form [formGroup]="assignmentForm" (ngSubmit)="submit()">
        <div class="mb-3">
            <label class="form-label">Descrizione dell'attività</label>
            <input type="text" class="form-control" placeholder="Es. Completare esercizio" formControlName="title"
                [class.is-invalid]="assignmentForm.controls.title.invalid && assignmentForm.controls.title.touched">
            <div class="invalid-feedback">La descrizione è obbligatoria</div>
        </div>
    </form>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="assignmentForm.invalid">Crea
        attività</button>
</div>
