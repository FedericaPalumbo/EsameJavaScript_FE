<div class="card mt-2">
    <div class="card-body">
        <h5 class="card-title fw-normal">{{ assignment().title }}</h5>
        <h6 class="card-subtitle mb-2 text-muted">{{ assignment().createdAt | date: 'longDate' }}</h6>
        <p class="card-text mb-1">Completata da {{ assignment().completedCount }}/{{ assignment().studentsCount }}
            studenti</p>
        <ngb-progressbar type="success" [value]="assignment().completedCount" [max]="assignment().studentsCount" />
    </div>
    @if (!assignment().completed) {
    <div class="card-footer text-muted text-end" *ifRole="'student'">
        <button class="btn btn-primary" (click)="complete()">Completa</button>
    </div>
    }
</div>
