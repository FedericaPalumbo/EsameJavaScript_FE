<nav class="app-navbar">
    <div class="navbar-inner">
        <!-- da loggato il logo porta alla lista classi, altrimenti alla home -->
        <a class="brand" [routerLink]="currentUser() ? '/classrooms' : '/'">
            <span class="brand-logo">
                <svg width="20" height="20" viewBox="0 0 20 20">
                    <rect x="2" y="9" width="4" height="9" rx="2" fill="#fff" />
                    <rect x="8" y="3" width="4" height="15" rx="2" fill="#f26b5b" />
                    <rect x="14" y="7" width="4" height="11" rx="2" fill="#fff" />
                </svg>
            </span>
            <span class="brand-name">Classroom</span>
        </a>

        <app-nav-user *ifAuthenticated="true; else loginBtn" [user]="currentUser()!" (logout)="logout()"></app-nav-user>

        <ng-template #loginBtn>
            @if (showLoginBtn()) {
            <a class="login-link" routerLink="/login">Login</a>
            }
        </ng-template>
    </div>
</nav>
