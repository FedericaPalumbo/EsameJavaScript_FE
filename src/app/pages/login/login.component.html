<div class="container mt-5">
    <div class="row">
        <div class="col col-lg-4 d-none d-lg-block"></div>

        <div class="col col-lg-4 col-md-12 border rounded p-4">
            <form [formGroup]="loginForm" (ngSubmit)="login()">
                <div class="form-outline mb-4">
                    <label class="form-label">Email Address</label>
                    <input class="form-control" type="email" formControlName="username">
                </div>

                <div class="form-outline mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <input #pwd class="form-control" type="password" formControlName="password">
                        <button class="btn btn-outline-secondary" type="button"
                            (click)="pwd.type = pwd.type === 'password' ? 'text' : 'password'">
                            {{ pwd.type === 'password' ? 'Mostra' : 'Nascondi' }}
                        </button>
                    </div>
                </div>
                <div class="text-danger">
                    {{ errorMessage() }}
                </div>

                <div class="text-center">
                    <button [disabled]="loginForm.invalid" type="submit" class="btn btn-primary btn-block mb-4">Sign
                        In</button>
                </div>
            </form>

            <div class="text-center">
                <a routerLink="/register">Registrati</a>
            </div>
        </div>
    </div>

</div>
