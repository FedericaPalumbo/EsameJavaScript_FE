<div class="container mt-4">
    <a [routerLink]="['/classrooms']">&larr; Torna alle classi</a>

    <h2 class="mt-3">Attività</h2>

    <div class="d-flex justify-content-end mb-3" *ifRole="'teacher'">
        <app-assignment-addpulsante (onAdd)="create($event)" />
    </div>

    @if (errorMessage()) {
    <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
    }

    @for (assignment of assignments$ | async; track assignment.id) {
    <app-assignment-item [assignment]="assignment" (onComplete)="complete(assignment.id)" />
    }
</div>
