<div class="assignments-page">
    <div class="page-container">
        <a class="back-link" [routerLink]="['/classrooms']">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6" />
            </svg>
            Torna alle classi
        </a>

        <header class="page-header">
            <div>
                <h1 class="page-title">Attività</h1>
                <p class="page-subtitle">Le consegne e i progressi della classe.</p>
            </div>

            <div class="header-action" *ifRole="'teacher'">
                <app-assignment-addpulsante (onAdd)="create($event)" />
            </div>
        </header>

        @if (errorMessage()) {
        <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
        }

        <div class="assignment-list">
            @for (assignment of assignments$ | async; track assignment.id) {
            <app-assignment-item [assignment]="assignment" (onComplete)="complete(assignment.id)"
                (onDetail)="navigateToDetail(assignment.id)" />
            }
        </div>
    </div>
</div>
